{{- if .Values.rbac.create -}}
{{- $targetNs := default .Release.Namespace .Values.rbac.targetNamespace -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubeflow-mcp.fullname" . }}-workloads
  namespace: {{ $targetNs }}
  labels:
    {{- include "kubeflow-mcp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubeflow-mcp.fullname" . }}-workloads
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeflow-mcp.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
