{{- if and .Values.auth.enabled .Values.auth.token (not .Values.auth.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubeflow-mcp.fullname" . }}-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeflow-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKey | default "token" }}: {{ .Values.auth.token | quote }}
{{- end }}
