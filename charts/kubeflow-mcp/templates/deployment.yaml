apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeflow-mcp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeflow-mcp.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kubeflow-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if and .Values.auth.enabled .Values.auth.token (not .Values.auth.existingSecret) }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "kubeflow-mcp.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kubeflow-mcp.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - kubeflow-mcp
            - serve
          args:
            - --transport
            - {{ .Values.server.transport | default "http" | quote }}
            - --persona
            - {{ .Values.server.persona | default "ml-engineer" | quote }}
            - --mode
            - {{ .Values.server.mode | default "full" | quote }}
            - --instruction-tier
            - {{ .Values.server.instructionTier | default "full" | quote }}
            - --clients
            - {{ join "," .Values.server.clients | quote }}
            {{- if .Values.server.readOnly }}
            - --read-only
            {{- end }}
            {{- with .Values.server.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port | default 8000 }}
              protocol: TCP
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: FASTMCP_HOST
              value: {{ .Values.server.host | default "0.0.0.0" | quote }}
            - name: FASTMCP_PORT
              value: {{ .Values.server.port | default 8000 | quote }}
            - name: FASTMCP_STATELESS_HTTP
              value: "true"
            - name: KUBEFLOW_MCP_ALLOWED_HOSTS
              value: {{ printf "%s,localhost,127.0.0.1,[::1],%s:*,localhost:*,127.0.0.1:*,[::1]:*" (include "kubeflow-mcp.fullname" .) (include "kubeflow-mcp.fullname" .) | quote }}
            {{- if and .Values.auth.enabled (or .Values.auth.token .Values.auth.existingSecret) }}
            - name: KUBEFLOW_MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "kubeflow-mcp.authSecretName" . }}
                  key: {{ .Values.auth.secretKey | default "token" }}
            {{- end }}
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config-volume
              mountPath: /app/.kubeflow-mcp.yaml
              subPath: config.yaml
              readOnly: true
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "kubeflow-mcp.fullname" . }}-config
        - name: tmp-volume
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
