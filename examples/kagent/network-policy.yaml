apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubeflow-mcp-ingress
spec:
  podSelector:
    matchLabels:
      app: kubeflow-mcp-http
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: agentgateway-system
      ports:
        - port: 8000
          protocol: TCP
