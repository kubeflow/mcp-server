apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubeflow-mcp
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: kubeflow-mcp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubeflow-mcp
                port:
                  number: 8000
