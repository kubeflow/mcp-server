[project]
name = "kubeflow-mcp"
dynamic = ["version"]
requires-python = ">=3.10"
description = "Model Context Protocol server for AI-assisted development with Kubeflow"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Kubeflow Authors"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "kubeflow==0.4.1",
    # Imported directly by the optimizer client to build V1beta1Experiment CRs.
    # Ships as a dependency of `kubeflow`, but declared here because we import
    # it ourselves rather than only reaching it through the SDK.
    "kubeflow-katib-api>=0.19.0",
    "huggingface-hub>=0.20",
    # Arrives transitively via `kubeflow`, but constrained here: 36.0.0 and
    # 36.0.1 look up the bearer token under a different api_key than the
    # kubeconfig and in-cluster loaders write it to, so no Authorization header
    # is sent and every call fails with a bare 401. Fixed in 36.0.2.
    # https://github.com/kubernetes-client/python/issues/2595
    "kubernetes!=36.0.0,!=36.0.1",
]

[project.optional-dependencies]
hub = ["kubeflow[hub]==0.4.1"]
spark = ["kubeflow[spark]==0.4.1"]
all = ["kubeflow[hub]==0.4.1", "kubeflow[spark]==0.4.1"]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=4.0",
    "ruff>=0.9",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.5",
]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
]

[project.urls]
Homepage = "https://github.com/kubeflow/mcp-server"
Documentation = "https://github.com/kubeflow/mcp-server#readme"
Source = "https://github.com/kubeflow/mcp-server"
Issues = "https://github.com/kubeflow/mcp-server/issues"

[project.scripts]
kubeflow-mcp = "kubeflow_mcp.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "kubeflow_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["kubeflow_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["kubeflow_mcp", "tests"]
addopts = "-v --tb=short -m 'not benchmark'"

markers = [
    "benchmark: performance benchmarks, excluded from default runs (see `make benchmark`)",
    "integration: requires Kind cluster with Trainer CRD",
    "slow: tests that take >5s (rate limiter, retry backoff)",
    "smoke: basic import and metadata checks",
]
[tool.uv]
# Pin transitive deps to versions that resolve known CVEs detected by the OSV-Scanner workflow.
constraint-dependencies = [
    "idna>=3.15",       # CVE-2026-45409
    "starlette>=1.3.1", # CVE-2026-54282, CVE-2026-54283
    "aiohttp>=3.14.0",  # CVE-2026-34993, CVE-2026-47265
    "pyjwt>=2.13.0",    # PYSEC-2026-175, PYSEC-2026-177, PYSEC-2026-178, PYSEC-2026-179
    "cryptography>=48.0.1",
    "msgpack>=1.2.1",
    "pip>=26.1.2",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.31",
    "kubernetes>=35.0.0,<36.0.0",
]
environments = [
    "python_version < '3.13'",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["kubeflow_mcp", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C90",  # mccabe cyclomatic complexity
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["kubeflow_mcp"]

[tool.coverage.run]
source = ["kubeflow_mcp"]
omit = ["*_test.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
