[project]
name = "kubeflow-mcp"
dynamic = ["version"]
requires-python = ">=3.10"
description = "Model Context Protocol server for AI-assisted development with Kubeflow"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Kubeflow Authors"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp==4.0.10",
    "authlib>=1.9.1", # CVE-2026-96760, CVE-2026-114616, CVE-2026-116672
    "httpx>=0.24.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "kubeflow>=0.5.0,<0.6.0",
    # Imported directly by the optimizer client to build V1beta1Experiment CRs.
    # Ships as a dependency of `kubeflow`, but declared here because we import
    # it ourselves rather than only reaching it through the SDK.
    "kubeflow-katib-api>=0.19.0",
    "huggingface-hub>=0.20",
    # Floors for transitive runtime dependencies, so pip installs also get the fixed releases.
    "joserfc>=1.7.6",  # CVE-2026-119283, CVE-2026-119284
    "oauthlib>=4.0.1", # CVE-2026-49272
    "opentelemetry-api>=1.45.2", # CVE-2026-114603, CVE-2026-126360: FastMCP parses traceparent and tracestate from request _meta
    # The fixed filelock and dnspython releases need Python 3.11, so 3.10 keeps the current ones.
    "filelock>=4.2.1; python_version >= '3.11'",  # CVE-2026-112907, -112909, -112910, -112913, -112915, -112935, -112936, -112939, -112940
    "dnspython>=2.9.2; python_version >= '3.11'", # CVE-2026-114605, CVE-2026-128089
]

[project.optional-dependencies]
hub = ["kubeflow[hub]>=0.5.0,<0.6.0"]
spark = ["kubeflow[spark]>=0.5.0,<0.6.0"]
pipelines = ["kubeflow[pipelines]>=0.5.0,<0.6.0"]
all = [
    "kubeflow[hub]>=0.5.0,<0.6.0",
    "kubeflow[spark]>=0.5.0,<0.6.0",
    "kubeflow[pipelines]>=0.5.0,<0.6.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=4.0",
    "ruff>=0.9",
    "httpx2>=2.13.1",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.5",
]
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
]

[project.urls]
Homepage = "https://github.com/kubeflow/mcp-server"
Documentation = "https://github.com/kubeflow/mcp-server#readme"
Source = "https://github.com/kubeflow/mcp-server"
Issues = "https://github.com/kubeflow/mcp-server/issues"

[project.scripts]
kubeflow-mcp = "kubeflow_mcp.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "kubeflow_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["kubeflow_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["kubeflow_mcp", "tests"]
addopts = "-v --tb=short -m 'not benchmark'"

markers = [
    "benchmark: performance benchmarks, excluded from default runs (see `make benchmark`)",
    "integration: requires Kind cluster with Trainer CRD",
    "slow: tests that take >5s (rate limiter, retry backoff)",
    "smoke: basic import and metadata checks",
]
[tool.uv]
# Pin transitive deps to versions that resolve known CVEs detected by the OSV-Scanner workflow.
constraint-dependencies = [
    "idna>=3.15",       # CVE-2026-45409
    "starlette>=1.3.1", # CVE-2026-54282, CVE-2026-54283
    "aiohttp>=3.14.0",  # CVE-2026-34993, CVE-2026-47265
    "pyjwt>=2.13.0",    # PYSEC-2026-175, PYSEC-2026-177, PYSEC-2026-178, PYSEC-2026-179
    "cryptography>=48.0.1",
    "msgpack>=1.2.1",
    "pip>=26.1.2",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.31",
    "kubernetes>=27.2.0,<36.0.0",
    "virtualenv>=21.14.10", # dev tooling (pre-commit): PYSEC-2026-4372 to PYSEC-2026-4387
    "soupsieve>=4.0.0; python_full_version >= '3.11.5'", # docs build: CVE-2026-126190 to CVE-2026-126193
    "soupsieve>=2.10.0; python_full_version < '3.11.5'", # docs build: CVE-2026-126192
    # No filelock release with the fixes supports Python 3.10, and every later one that does
    # has more open advisories than 3.29.x, so keep 3.10 there.
    "filelock<3.30; python_version < '3.11'",
]
environments = [
    "python_version < '3.13'",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["kubeflow_mcp", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C90",  # mccabe cyclomatic complexity
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["kubeflow_mcp"]

[tool.coverage.run]
source = ["kubeflow_mcp"]
omit = ["*_test.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
