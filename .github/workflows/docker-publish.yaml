name: Build and Push Docker Image

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version/tag to build and push (e.g. 0.1.0). Leave blank to build without pushing.'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Release version/tag to build (used for image tags and checkout ref).'
        required: true
        type: string
      skip-scan:
        description: 'Skip the pre-push image scan because the caller already ran it.'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Scan before anything is pushed, so a vulnerable image never reaches GHCR.
  # Blocks a versioned push on fixable CRITICAL CVEs; on pull requests it only reports.
  scan:
    if: ${{ !inputs.skip-scan }}
    permissions:
      contents: read
    uses: ./.github/workflows/image-scan.yaml
    with:
      ref: ${{ inputs.version || github.ref }}
      version: ${{ inputs.version }}
      fail-on-findings: ${{ github.event_name != 'pull_request' && inputs.version != '' }}

  build-and-push:
    needs: scan
    if: ${{ !cancelled() && (needs.scan.result == 'success' || needs.scan.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.version || github.ref }}

      - name: Parse version
        id: ver
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          STABLE=false
          MAJOR_MINOR=""
          MAJOR=""
          # A stable release is exactly X.Y.Z. RC/pre-release versions (X.Y.ZrcN)
          # only get the exact-version tag, never the moving major/minor/latest tags.
          if [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            STABLE=true
            MAJOR_MINOR=$(echo "$V" | cut -d. -f1,2)
            MAJOR=$(echo "$V" | cut -d. -f1)
          fi
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"
          echo "major_minor=$MAJOR_MINOR" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          # Push only when we have a concrete version to publish and it's not a PR.
          if [[ "${{ github.event_name }}" != "pull_request" && -n "$V" ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.ver.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Release versions are PEP 440 (e.g. 0.1.0rc1), which is not valid SemVer,
          # so tags are built with type=raw from the parsed version instead of type=semver.
          tags: |
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=${{ steps.ver.outputs.major_minor }},enable=${{ steps.ver.outputs.stable == 'true' }}
            type=raw,value=${{ steps.ver.outputs.major }},enable=${{ steps.ver.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.stable == 'true' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.ver.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SBOM and SLSA provenance are stored in GHCR next to the image.
          sbom: ${{ steps.ver.outputs.push == 'true' }}
          provenance: ${{ steps.ver.outputs.push == 'true' && 'mode=max' || 'false' }}

      - name: Attest build provenance
        if: steps.ver.outputs.push == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify provenance attestation
        if: steps.ver.outputs.push == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify \
            "oci://${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}" \
            --repo "${{ github.repository }}"
