name: Build and Push Docker Image

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Development tag (dev-* or sha-*). Defaults to a commit SHA tag.'
        required: false
        type: string
      publish:
        description: 'Publish the image to GHCR. Defaults to false.'
        required: false
        default: false
        type: boolean
      ref:
        description: 'Branch or tag to build from.'
        required: true
        default: main
        type: string
  workflow_call:
    inputs:
      ref:
        description: 'Exact source ref to build.'
        required: true
        type: string
      publish:
        required: true
        type: boolean
      release:
        description: 'Allow release tags; only set by the release workflow.'
        default: false
        type: boolean
      version:
        description: 'Release version/tag to build (used for image tags and checkout ref).'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Parse version
        id: ver
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
          RELEASE_BUILD: ${{ inputs.release || false }}
          SOURCE_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          V="$REQUESTED_VERSION"
          if [[ -z "$V" ]]; then
            V="sha-$(git rev-parse --short=12 HEAD)"
          fi
          if [[ ! "$V" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "Invalid image tag: $V" >&2
            exit 1
          fi
          if [[ "$RELEASE_BUILD" == "true" ]]; then
            if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$ || "$SOURCE_REF" != "refs/tags/$V" ]]; then
              echo "Release builds require a release version and its matching tag ref." >&2
              exit 1
            fi
          elif [[ "$V" != dev-* && "$V" != sha-* ]]; then
            echo "Manual image tags must start with dev- or sha-." >&2
            exit 1
          fi
          STABLE=false
          MAJOR_MINOR=""
          MAJOR=""
          # A stable release is exactly X.Y.Z. RC/pre-release versions (X.Y.ZrcN)
          # only get the exact-version tag, never the moving major/minor/latest tags.
          if [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            STABLE=true
            MAJOR_MINOR=$(echo "$V" | cut -d. -f1,2)
            MAJOR=$(echo "$V" | cut -d. -f1)
          fi
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"
          echo "major_minor=$MAJOR_MINOR" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # Reusable workflows inherit the caller's event; publication is an explicit input.
          if [[ "$REQUESTED_PUBLISH" == "true" && "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.ver.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Release versions are PEP 440 (e.g. 0.1.0rc1), which is not valid SemVer,
          # so tags are built with type=raw from the parsed version instead of type=semver.
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.major_minor }},enable=${{ steps.ver.outputs.stable == 'true' }}
            type=raw,value=${{ steps.ver.outputs.major }},enable=${{ steps.ver.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.stable == 'true' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.ver.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for critical CVEs (Trivy)
        if: steps.ver.outputs.push == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true
