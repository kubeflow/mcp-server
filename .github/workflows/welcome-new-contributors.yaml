name: Welcome new contributors

on:
  pull_request_target:
    types:
      - opened
  issues:
    types:
      - opened

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      # actions/first-interaction@v3 greets returning contributors on every
      # PR (its PR check ignores the author, and its skip guard lets any PR
      # author who has never filed an issue through — see issue #171 and
      # https://github.com/actions/first-interaction/issues/369). Check the
      # author's own history via the search API instead.
      - uses: actions/github-script@v8
        env:
          ISSUE_MESSAGE: |
            🎉 **Welcome to the Kubeflow MCP Server!** 🎉

            Thanks for opening your first issue! We're happy to have you as part of our community 🚀

            **Here's what happens next:**

            - Our team will review your issue soon! cc @kubeflow/kubeflow-sdk-team
            - If you'd like to contribute to this issue, check out our [Contributing Guide](https://github.com/kubeflow/mcp-server/blob/main/CONTRIBUTING.md) for repo-specific guidelines and the [Kubeflow Contributor Guide](https://www.kubeflow.org/docs/about/contributing/) for general community standards

            **Join the community:**
            - **Slack**: Join our [#kubeflow-ml-experience](https://www.kubeflow.org/docs/about/community/#kubeflow-slack-channels) Slack channel
            - **Meetings**: Attend the [Kubeflow SDK and ML Experience](https://bit.ly/kf-ml-experience) bi-weekly meetings

            Feel free to ask questions in the comments if you need any help or clarification!
            Thanks again for contributing to Kubeflow! 🙏

          PR_MESSAGE: |
            🎉 **Welcome to the Kubeflow MCP Server!** 🎉

            Thanks for opening your first PR! We're happy to have you as part of our community 🚀

            **Here's what happens next:**

            - If you haven't already, please check out our [Contributing Guide](https://github.com/kubeflow/mcp-server/blob/main/CONTRIBUTING.md) for repo-specific guidelines and the [Kubeflow Contributor Guide](https://www.kubeflow.org/docs/about/contributing/) for general community standards
            - Our team will review your PR soon! cc @kubeflow/kubeflow-sdk-team

            **Join the community:**
            - **Slack**: Join our [#kubeflow-ml-experience](https://www.kubeflow.org/docs/about/community/#kubeflow-slack-channels) Slack channel
            - **Meetings**: Attend the [Kubeflow SDK and ML Experience](https://bit.ly/kf-ml-experience) bi-weekly meetings

            Feel free to ask questions in the comments if you need any help or clarification!
            Thanks again for contributing to Kubeflow! 🙏
        with:
          script: |
            const sender = context.payload.sender
            if (!sender || sender.type === 'Bot') {
              return core.info('Skipping: bot or missing sender')
            }

            const isIssue = context.payload.issue !== undefined
            const number = context.issue.number
            const type = isIssue ? 'issue' : 'pr'

            // Count the author's earlier issues or PRs in this repo.
            const query = `repo:${context.repo.owner}/${context.repo.repo} type:${type} author:${sender.login}`
            const { data } = await github.rest.search.issuesAndPullRequests({
              q: query,
              advanced_search: true,
              per_page: 100,
            })

            if (data.items.some((item) => item.number < number)) {
              return core.info(`Skipping: not ${sender.login}'s first ${type}`)
            }

            core.info(`Welcoming ${sender.login} on their first ${type} (#${number})`)
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body: isIssue ? process.env.ISSUE_MESSAGE : process.env.PR_MESSAGE,
            })
