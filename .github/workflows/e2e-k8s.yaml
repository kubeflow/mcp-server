name: E2E Test - Kubernetes

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E Test (Kind Cluster)
    runs-on: oracle-vm-16cpu-64gb-x86-64

    strategy:
      fail-fast: false
      matrix:
        kubernetes-version: ["1.32.3"]
        trainer-ref: ["master"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout Kubeflow Trainer repository
        uses: actions/checkout@v7
        with:
          repository: kubeflow/trainer
          ref: ${{ matrix.trainer-ref }}
          path: trainer

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Synchronize dependencies
        run: uv sync --all-extras --group dev

      - name: Setup cluster
        run: |
          cd ./trainer
          make test-e2e-setup-cluster \
            K8S_VERSION=${{ matrix.kubernetes-version }}
          kubectl get clustertrainingruntimes

      - name: Run E2E Tests
        env:
          KUBEFLOW_MCP_E2E: "true"
        run: |
          uv run pytest tests/e2e/test_kubernetes_e2e.py -v
