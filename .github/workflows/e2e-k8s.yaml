name: E2E Test - Kubernetes

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E Test (Kind Cluster)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Kubernetes Kind Cluster
        uses: helm/kind-action@v1.10.0
        with:
          node_image: kindest/node:v1.32.2

      - name: Verify Cluster Ready
        run: |
          kubectl cluster-info
          kubectl get nodes -o wide

      - name: Install Kubeflow Trainer CRDs
        run: |
          kubectl apply --server-side -k "github.com/kubeflow/trainer.git/manifests/base/crds?ref=v2.2.0"
          kubectl wait --for=condition=Established --timeout=60s crd/trainjobs.trainer.kubeflow.org
          kubectl wait --for=condition=Established --timeout=60s crd/clustertrainingruntimes.trainer.kubeflow.org

      - name: Install ClusterTrainingRuntimes
        run: |
          kubectl apply --server-side -k "github.com/kubeflow/trainer.git/manifests/overlays/runtimes?ref=v2.2.0"
          kubectl get clustertrainingruntimes

      - name: Mock GPU resource on Kind Node
        run: |
          NODE_NAME=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
          echo "Mocking nvidia.com/gpu on node: $NODE_NAME"
          kubectl patch node "$NODE_NAME" --subresource=status --type=json -p='[
            {"op": "add", "path": "/status/capacity/nvidia.com~1gpu", "value": "1"},
            {"op": "add", "path": "/status/allocatable/nvidia.com~1gpu", "value": "1"}
          ]'
          # Verify node has Nvidia GPU allocatable
          kubectl get node "$NODE_NAME" -o jsonpath='{.status.allocatable}'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Synchronize dependencies
        run: uv sync --all-extras --group dev

      - name: Run E2E Tests
        env:
          KUBEFLOW_MCP_E2E: "true"
        run: |
          uv run pytest tests/e2e/test_kubernetes_e2e.py -v
